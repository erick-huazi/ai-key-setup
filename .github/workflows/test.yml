name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile ai_key_setup.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Package smoke test
        run: |
          python -m pip install --no-deps .
          ai-key-setup --version
          python -m pip check
      - name: PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\ai-key-setup.ps1 --version
      - name: Bash wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n ai-key-setup.sh
          bash ai-key-setup.sh --version
