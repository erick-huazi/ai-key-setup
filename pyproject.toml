[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-key-setup"
version = "3.0.0"
description = "Safely configure API keys and Codex custom model providers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Erick Huazi" }]
keywords = ["codex", "api-key", "configuration", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
ai-key-setup = "ai_key_setup:main"

[project.urls]
Homepage = "https://github.com/erick-huazi/ai-key-setup"
Issues = "https://github.com/erick-huazi/ai-key-setup/issues"

[tool.setuptools]
py-modules = ["ai_key_setup"]
